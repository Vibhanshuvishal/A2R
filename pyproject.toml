[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2r"
version = "0.2.0"
description = "A2R — Adaptive Agentic Retrieval Router: 100% Local-first RAG with Contextual Bandit Routing, Semantic Caching, Multi-turn Chat, and SSE Streaming"
readme = "README.md"
authors = [{ name = "Vibhanshu Vishal" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "contextual-bandit",
  "semantic-cache",
  "local-llm",
  "chromadb",
  "ollama",
  "qwen",
  "fastapi",
  "ai-agents"
]
dependencies = [
  "chromadb>=0.5",
  "fastapi>=0.115",
  "gradio>=5.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "sentence-transformers>=3.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
public-demo = ["transformers>=4.45", "torch>=2.4"]
test = ["pytest>=8.0", "pytest-mock>=3.0"]

[project.urls]
Homepage = "https://github.com/Vibhanshuvishal/A2R"
Repository = "https://github.com/Vibhanshuvishal/A2R"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["a2r*"]
