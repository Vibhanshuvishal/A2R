[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2r"
version = "0.2.0"
description = "Adaptive, local-first retrieval router for domain knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vibhanshu Vishal", email = "111078001+Vibhanshuvishal@users.noreply.github.com" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "contextual-bandit",
  "semantic-cache",
  "local-llm",
  "chromadb",
  "ollama",
  "qwen",
  "fastapi",
  "ai-agents"
]
dependencies = [
  "chromadb>=0.5",
  "fastapi>=0.115",
  "gradio>=5.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "sentence-transformers>=3.0",
  "uvicorn>=0.30",
  "aiofiles>=24.0",
]

[project.optional-dependencies]
public-demo = ["transformers>=4.45", "torch>=2.4"]
test = ["pytest>=8.0", "pytest-mock>=3.0"]

[project.urls]
Homepage = "https://github.com/Vibhanshuvishal/A2R"
Repository = "https://github.com/Vibhanshuvishal/A2R"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
